name: Build

on:
  push:
    branches: [prod, main]
  pull_request:

jobs:
  check:
    if: github.ref_name != 'prod'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: cargo check

  build-apk:
    if: github.ref_name == 'prod'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Accept licenses & install NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0"

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --locked

      - name: Build APK
        run: dx build --platform android --release --target aarch64-linux-android
        env:
          NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.0.12077973

      - name: Inject launcher icons
        run: |
          RES=$(find target/dx -type d -path '*app/src/main/res' | head -1)
          find "$RES" -name 'ic_launcher*.webp' -type f -delete
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; px=${pair##*:}
            convert icons/icon.png -resize ${px}x${px} "$RES/mipmap-${d}/ic_launcher.png"
          done
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher.xml"

      - name: Rebuild APK with icons
        run: |
          GRADLE_DIR=$(dirname "$(find target/dx -name gradlew | head -1)")
          cd "$GRADLE_DIR"
          ./gradlew assembleRelease

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Sign APK
        run: |
          SDK=/usr/local/lib/android/sdk
          APK=$(find target/dx -name 'app-release-unsigned.apk' | head -1)
          echo "APK trouvé : $APK"
          $SDK/build-tools/34.0.0/zipalign -f 4 "$APK" app-release-aligned.apk
          $SDK/build-tools/34.0.0/apksigner sign \
            --ks release.keystore --ks-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            --ks-key-alias ${{ secrets.ANDROID_KEY_ALIAS }} \
            --out app-release-signed.apk app-release-aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prepa-plus-apk
          path: |
            target/dx/**/apk/**/*.apk
            target/dx/**/app/build/outputs/apk/**/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prepa-plus-apk
          path: app-release-signed.apk
