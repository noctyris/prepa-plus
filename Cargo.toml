[package]
name = "prepa-plus"
version = "0.2.0-alpha.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dioxus = { version = "0.7.10", features = ["desktop", "router"] }
dirs = "7.0.0"
image-rs = { version = "0.1.2", features = ["dio"] }
ndk-context = "0.1.1"
regex = "1.13.1"
reqwest = { version = "0.13", features = ["rustls", "cookies", "form", "charset", "http2", "system-proxy"], default-features = false }
rustls = "0.23"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
webpki-roots = "1"
