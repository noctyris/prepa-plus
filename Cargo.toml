[package]
name = "prepa-plus"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dioxus = { version = "0.7.10", features = ["desktop", "router"] }
dotenv = "0.15.0"
regex = "1.13.1"
reqwest = { version = "0.13", features = ["blocking", "cookies", "form"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
